<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>重複程式碼偵測</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--mut:#6b7280;--bd:#d9dce1;--card:#f6f7f9;--add:#d3f0d8;--del:#fadada;--ren:#fff0b8;--acc:#2563eb;--accfg:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#16181d;--fg:#e8e9ec;--mut:#9aa0aa;--bd:#2c3038;--card:#1f2229;--add:#1f3d27;--del:#472428;--ren:#4a421c;--acc:#6ea0ff;--accfg:#10141c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,"Microsoft JhengHei",sans-serif}
main{max-width:1700px;margin:0 auto;padding:20px 16px 60px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
#right{position:sticky;top:12px;height:calc(100vh - 24px);display:flex;flex-direction:column;border:1px solid var(--bd);border-radius:8px;padding:12px;background:var(--card)}
#right h2{font-size:17px;margin:0 0 4px}
#right .row{margin:8px 0}
#work{flex:1;height:auto;min-height:260px;background:var(--bg);resize:none}
@media(max-width:980px){main{grid-template-columns:minmax(0,1fr)}#right{position:static;height:auto}#work{height:360px;flex:none}}
.sw{padding:2px 10px;font-size:13px}
.gbox{overflow:auto;border:1px solid var(--bd);border-radius:8px;background:var(--bg);max-height:520px}
.gsvg text{font:12px Consolas,monospace;fill:var(--fg);pointer-events:none}
.gsvg .glab{font:11px system-ui,sans-serif;fill:var(--mut)}
.gsvg .gcnt{font:11px system-ui,sans-serif;fill:var(--mut)}
.gsvg .gn{cursor:pointer}
.gsvg .gn rect.b{fill:var(--bg);stroke:var(--bd);stroke-width:1.5}
.gsvg .gedge{fill:none;stroke:var(--mut);stroke-width:1.2}
.chip{display:inline-block;margin:0 6px 6px 0}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 16px}
textarea{width:100%;height:240px;font:13px/1.45 Consolas,monospace;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:10px;resize:vertical;white-space:pre;overflow:auto}
.row{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin:12px 0}
label{display:flex;gap:6px;align-items:center}
input[type=number]{width:64px;padding:4px 6px;border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--fg)}
button{font:inherit;padding:6px 14px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
button.pri{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
button.on{outline:2px solid var(--acc)}
#status{color:var(--mut)}
.card{border:1px solid var(--bd);border-radius:8px;margin:14px 0;background:var(--card);padding:12px 14px}
.ch{font-weight:600;margin-bottom:8px}
.locs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.hint{color:var(--mut);font-size:13px}
.dv{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font:12.5px/1.4 Consolas,monospace}
td{padding:0 6px;vertical-align:top;white-space:pre;border-top:1px solid transparent}
td.n{color:var(--mut);text-align:right;width:44px;user-select:none}
td.c{width:calc(50% - 44px)}
td.add{background:var(--add)} td.del{background:var(--del)} td.ren{background:var(--ren)}
.iftbl td{white-space:normal;border-top:1px solid var(--bd);padding:4px 8px}
.iftbl tr.r{cursor:pointer} .iftbl tr.r:hover{background:var(--card)}
.iftbl td.cond{font-family:Consolas,monospace;word-break:break-all}
.iftbl pre{margin:0;padding:8px;background:var(--card);border-radius:6px;white-space:pre-wrap;font:12.5px/1.5 Consolas,monospace}
.tag{background:var(--ren);border-radius:4px;padding:0 6px;font-size:12px}
.legend span{padding:1px 8px;border-radius:4px;margin-right:6px;font-size:12px}
</style>
</head>
<body>
<main>
<section id="left">
<h1>重複程式碼偵測</h1>
<p class="sub">貼上 C# 程式碼(可分段貼),找出出現多次的區塊,並排顯示差異。全部在瀏覽器內執行,不上傳、不需安裝。</p>

<textarea id="src" spellcheck="false" placeholder="在這裡貼上程式碼,或載入 .txt / .cs 檔案"></textarea>

<div class="row">
  <button id="load">載入檔案…</button>
  <input type="file" id="file" accept=".txt,.cs" multiple hidden>
  <button id="sample">載入範例</button>
  <button id="clear">清空</button>
  <span id="count" class="hint"></span>
</div>

<div class="row">
  <label>最少重複行數 <input type="number" id="minl" value="30" min="3"></label>
  <label>容許差異行數 <input type="number" id="gap" value="3" min="0" max="20"></label>
  <label>最低相似度 % <input type="number" id="sim" value="60" min="10" max="100"></label>
  <label><input type="checkbox" id="ign" checked> 忽略變數名與常數值</label>
  <button class="pri" id="go">找重複</button>
  <button id="goif">列出 if 與測試項目</button>
  <button id="gograph">畫 if 節點圖</button>
  <span id="status"></span>
</div>
<p class="hint">行數只計實際程式行(不含空行、註解、單獨的大括號)。「容許差異行數」決定 else 多一兩行這類近似重複算不算同一組。</p>

<div id="out"></div>
<div id="ifout"></div>
<div id="graphout"></div>
</section>

<aside id="right">
  <h2>作業區</h2>
  <div class="hint">把左邊找到的區塊送過來,在這裡貼上、改寫、整理成函式。內容會暫存在這個瀏覽器裡。</div>
  <div class="row">
    <button id="wcopy">複製全部</button>
    <button id="wdl">下載 .cs</button>
    <button id="wclear">清空</button>
    <span id="wcount" class="hint"></span>
  </div>
  <textarea id="work" spellcheck="false" placeholder="作業區:可直接貼上、修改程式碼"></textarea>
</aside>
</main>

<script src="core.js"></script>
<script src="ifs.js"></script>
<script src="graph.js"></script>
<script src="sample.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var lastLines = [];

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function updateCount() { var n = $('src').value ? $('src').value.split('\n').length : 0; $('count').textContent = n ? n + ' 行' : ''; }

  $('src').addEventListener('input', updateCount);
  $('load').onclick = function () { $('file').click(); };
  $('file').onchange = function () {
    var files = Array.prototype.slice.call(this.files), self = this;
    Promise.all(files.map(function (f) {
      return f.text().then(function (t) { return '//=== ' + f.name + '\n' + t; });
    })).then(function (parts) {
      var cur = $('src').value;
      $('src').value = (cur ? cur + '\n' : '') + parts.join('\n');
      self.value = ''; updateCount();
    });
  };
  $('sample').onclick = function () { $('src').value = window.SAMPLE; $('minl').value = 10; updateCount(); };
  $('clear').onclick = function () { $('src').value = ''; $('out').innerHTML = ''; $('status').textContent = ''; updateCount(); };

  $('go').onclick = function () {
    $('status').textContent = '分析中…'; $('out').innerHTML = '';
    setTimeout(run, 20);
  };

  function run() {
    var t0 = performance.now();
    var opt = { minLines: +$('minl').value, gap: +$('gap').value, minSim: +$('sim').value / 100, ignoreNames: $('ign').checked };
    var r = DupCore.analyze($('src').value, opt);
    lastLines = r.lines;
    var sec = ((performance.now() - t0) / 1000).toFixed(2);
    $('status').textContent = '完成:有效程式 ' + r.keptCount + ' 行,找到 ' + r.groups.length + ' 組,耗時 ' + sec + ' 秒';
    var out = $('out');
    if (r.truncated) {
      out.insertAdjacentHTML('beforeend', '<p class="hint">提醒:有些極常出現的片段(超過 200 處)被略過,這通常是樣板程式碼。</p>');
    }
    if (!r.groups.length) {
      out.insertAdjacentHTML('beforeend', '<p>沒有找到符合條件的重複。可以調低「最少重複行數」或「最低相似度」,或勾選「忽略變數名與常數值」。</p>');
      return;
    }
    r.groups.forEach(function (g, gi) { out.appendChild(card(g, gi)); });
  }

  function loc(m) { return '第 ' + (m.from + 1) + '–' + (m.to + 1) + ' 行'; }

  function card(g, gi) {
    var d = document.createElement('div'); d.className = 'card';
    d.innerHTML = '<div class="ch">第 ' + (gi + 1) + ' 組:' + g.members.length + ' 處 · 約 ' + g.lines + ' 行 · 相似度 ' + Math.round(g.sim * 100) + '%</div>' +
      '<div class="locs"></div><div class="hint">以第一處為基準,點其他處查看差異。</div><div class="dv"></div>';
    var locs = d.querySelector('.locs'), dv = d.querySelector('.dv'), btns = [];
    g.members.forEach(function (m, i) {
      var wrap = document.createElement('span');
      var b = document.createElement('button');
      b.textContent = (i === 0 ? '基準 ' : '') + loc(m);
      if (i > 0) b.onclick = function () { show(i); };
      else b.disabled = true;
      var sb = document.createElement('button'); sb.className = 'sw'; sb.textContent = '→ 作業區';
      sb.title = '把這一處複製到右側作業區';
      sb.onclick = function () { sendToWork('重複區塊 ' + loc(m), lastLines.slice(m.from, m.to + 1).map(function (l) { return l.raw; }).join('\n')); };
      wrap.appendChild(b); wrap.appendChild(sb); locs.appendChild(wrap); btns.push(b);
    });
    function show(i) {
      btns.forEach(function (b, k) { b.classList.toggle('on', k === i); });
      dv.innerHTML = renderDiff(g.members[0], g.members[i]);
    }
    if (g.members.length > 1) show(1);
    return d;
  }

  function renderDiff(m1, m2, lines) {
    lines = lines || lastLines;
    var A = lines.slice(m1.from, m1.to + 1), B = lines.slice(m2.from, m2.to + 1);
    var ops = DupCore.diffLines(A, B);
    if (!ops) return '<p class="hint">區塊太大,無法並排顯示。請縮小範圍後再試。</p>';
    var c = { eq: 0, ren: 0, del: 0, add: 0 };
    var rows = ops.map(function (o) {
      c[o.t]++;
      var a = o.a, b = o.b, ca = '', cb = '';
      if (o.t === 'del') ca = 'del'; else if (o.t === 'add') cb = 'add'; else if (o.t === 'ren') ca = cb = 'ren';
      return '<tr><td class="n">' + (a ? a.no : '') + '</td><td class="c ' + ca + '">' + esc(a ? a.raw : '') +
        '</td><td class="n">' + (b ? b.no : '') + '</td><td class="c ' + cb + '">' + esc(b ? b.raw : '') + '</td></tr>';
    }).join('');
    return '<p class="legend hint"><span>完全相同 ' + c.eq + '</span><span style="background:var(--ren)">僅命名/常數不同 ' + c.ren +
      '</span><span style="background:var(--del)">只在基準有 ' + c.del + '</span><span style="background:var(--add)">只在此處有 ' + c.add + '</span></p>' +
      '<table>' + rows + '</table>';
  }

  /* ---------- if 清單與測試項目 ---------- */
  var ifData = [], ifLines = [];
  $('goif').onclick = function () {
    $('status').textContent = '分析 if 中…'; $('ifout').innerHTML = '';
    setTimeout(runIfs, 20);
  };

  var ifText = null, ifIgn = null, gLines = [];
  function computeIfs() {                      // 文字與選項沒變就沿用上次結果
    var text = $('src').value, ign = $('ign').checked;
    if (ifText === text && ifIgn === ign) return;
    ifLines = text.split(/\r?\n/);
    ifData = IfCore.analyzeIfs(text, { ignoreNames: ign });
    gLines = DupCore.parse(text, ign).lines;
    ifText = text; ifIgn = ign;
  }

  function runIfs() {
    var t0 = performance.now();
    computeIfs();
    var rep = ifData.filter(function (i) { return i.groupSize > 1; }).length;
    $('status').textContent = '完成:找到 ' + ifData.length + ' 個 if,其中 ' + rep + ' 個與其他處條件相同,耗時 ' +
      ((performance.now() - t0) / 1000).toFixed(2) + ' 秒';
    var box = $('ifout');
    if (!ifData.length) { box.innerHTML = '<p>沒有找到 if。</p>'; return; }
    box.innerHTML = '<h2 style="font-size:17px">if 清單</h2>' +
      '<div class="row"><label>篩選條件文字 <input type="text" id="iff" style="padding:4px 6px;border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--fg)"></label>' +
      '<label><input type="checkbox" id="ifrep"> 只看有相同條件的</label>' +
      '<label><input type="checkbox" id="ifsort"> 相同條件排在一起</label>' +
      '<button id="ifdl">下載全部測試項目 (.txt)</button></div>' +
      '<div class="hint" id="ifnote"></div><div class="dv"><table class="iftbl"><thead><tr><td>行</td><td>條件</td><td>深度</td><td>分支</td><td>相同條件</td></tr></thead><tbody id="ifbody"></tbody></table></div>';
    ['iff', 'ifrep', 'ifsort'].forEach(function (id) { $(id).addEventListener('input', renderIfRows); });
    $('ifdl').onclick = downloadIfs;
    renderIfRows();
  }

  function renderIfRows() {
    var q = $('iff').value.trim().toLowerCase(), onlyRep = $('ifrep').checked, sort = $('ifsort').checked;
    var rows = ifData.filter(function (i) {
      return (!q || i.cond.toLowerCase().indexOf(q) >= 0) && (!onlyRep || i.groupSize > 1);
    });
    if (sort) rows = rows.slice().sort(function (a, b) { return b.groupSize - a.groupSize || (a.key < b.key ? -1 : a.key > b.key ? 1 : 0) || a.line - b.line; });
    var CAP = 300, shown = rows.slice(0, CAP);
    $('ifnote').textContent = '符合 ' + rows.length + ' 個' + (rows.length > CAP ? ',只顯示前 ' + CAP + ' 個,請用篩選縮小範圍' : '') + '。點一列看測試項目。';
    $('ifbody').innerHTML = shown.map(function (i, k) {
      var br = (i.hasElse ? 'else' : '') + (i.hasElseIf ? 'else if' : '') + (i.isElseIf ? (i.hasElse || i.hasElseIf ? ' / ' : '') + '本身是 else if' : '');
      return '<tr class="r" data-k="' + k + '"><td>' + i.line + '</td><td class="cond">' + esc(i.cond.length > 110 ? i.cond.slice(0, 110) + '…' : i.cond) +
        '</td><td>' + i.depth + '</td><td>' + esc(br || '—') + '</td><td>' + (i.groupSize > 1 ? '<span class="tag">' + i.groupSize + ' 處</span>' : '—') + '</td></tr>';
    }).join('');
    Array.prototype.forEach.call($('ifbody').querySelectorAll('tr.r'), function (tr) {
      tr.onclick = function () {
        var nx = tr.nextSibling;
        if (nx && nx.className === 'd') { nx.remove(); return; }
        var d = document.createElement('tr'); d.className = 'd';
        var info = shown[+tr.getAttribute('data-k')];
        d.innerHTML = '<td colspan="5"><pre>' + esc(IfCore.formatText(info)) + '</pre>' +
          '<p><button class="sw" data-w="code">→ 作業區:這段程式碼</button> <button class="sw" data-w="test">→ 作業區:測試項目</button></p></td>';
        d.querySelector('[data-w=code]').onclick = function () {
          sendToWork('if 第 ' + info.line + '–' + info.endLine + ' 行', ifLines.slice(info.line - 1, info.endLine).join('\n'));
        };
        d.querySelector('[data-w=test]').onclick = function () {
          sendToWork('測試項目 if 第 ' + info.line + ' 行', IfCore.formatText(info).split('\n').map(function (s) { return '// ' + s; }).join('\n'));
        };
        tr.parentNode.insertBefore(d, tr.nextSibling);
      };
    });
  }

  function downloadIfs() {
    var text = ifData.map(IfCore.formatText).join('\n\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/plain;charset=utf-8' }));
    a.download = 'if-test-items.txt'; document.body.appendChild(a); a.click(); a.remove();
  }

  /* ---------- if 節點圖 ---------- */
  var gSel = -1, gRoot = -1, gFrom = 1, gTo = 1e9, gDiffId = -1;
  var NODE_W = 220, NODE_H = 28, COL_W = 270, ROW_H = 40, MAX_NODES = 200;

  $('gograph').onclick = function () {
    $('status').textContent = '畫圖中…';
    setTimeout(function () { gRoot = -1; gSel = -1; gDiffId = -1; computeIfs(); drawGraph(); }, 20);
  };

  function groupColors(nodes) {
    var count = new Map();
    nodes.forEach(function (n) { if (n.groupSize > 1) count.set(n.key, n.groupSize); });
    var keys = Array.from(count.keys()).sort(function (a, b) { return count.get(b) - count.get(a); }), map = new Map();
    keys.forEach(function (k, i) { map.set(k, 'hsl(' + Math.round((i * 137.5) % 360) + ' 70% 48%)'); });
    return map;
  }

  function scopeNodes() {
    if (gRoot >= 0) {
      var r = ifData[gRoot];
      return ifData.filter(function (i) { return i.line >= r.line && i.line <= r.endLine; });
    }
    return ifData.filter(function (i) { return i.line >= gFrom && i.line <= gTo; });
  }

  function drawGraph() {
    var box = $('graphout');
    if (!ifData.length) { box.innerHTML = '<p>沒有找到 if。</p>'; $('status').textContent = ''; return; }
    var nodes = scopeNodes();
    var head = '<h2 style="font-size:17px">if 節點圖</h2>' +
      '<div class="row"><label>行範圍 <input type="number" id="gfrom" value="' + (gFrom > 1 ? gFrom : '') + '" placeholder="起" min="1"> – ' +
      '<input type="number" id="gto" value="' + (gTo < 1e9 ? gTo : '') + '" placeholder="迄" min="1"></label>' +
      '<button id="gredraw">重畫</button>' + (gRoot >= 0 ? '<button id="gall">回到全部</button>' : '') + '</div>';
    box.innerHTML = head + '<div id="gbody"></div>';
    $('gredraw').onclick = function () {
      gFrom = +$('gfrom').value || 1; gTo = +$('gto').value || 1e9; gRoot = -1; gSel = -1; gDiffId = -1; drawGraph();
    };
    if ($('gall')) $('gall').onclick = function () { gRoot = -1; gSel = -1; gDiffId = -1; drawGraph(); };

    if (nodes.length > MAX_NODES) {
      $('gbody').innerHTML = '<p>這個範圍有 ' + nodes.length + ' 個 if,超過 ' + MAX_NODES + ' 個圖會看不清楚。請用上面的行範圍縮小,例如一個方法的起訖行。</p>';
      $('status').textContent = '範圍太大(' + nodes.length + ' 個 if)'; return;
    }
    if (!nodes.length) { $('gbody').innerHTML = '<p>這個範圍沒有 if。</p>'; return; }

    var L = GraphCore.layout(nodes), colors = groupColors(nodes), byId = new Map();
    nodes.forEach(function (n) { byId.set(n.id, n); });
    var sel = byId.get(gSel), selKey = sel && sel.groupSize > 1 ? sel.key : null;
    var W = L.cols * COL_W + 20, H = Math.ceil((L.rows - 1) * ROW_H + NODE_H + 24);
    function nx(id) { return 10 + L.pos.get(id).x * COL_W; }
    function ny(id) { return 10 + L.pos.get(id).y * ROW_H; }

    var s = '<svg class="gsvg" width="' + W + '" height="' + H + '" xmlns="http://www.w3.org/2000/svg">';
    L.edges.forEach(function (e) {
      if (e.kind === 'nest') {
        var x1 = nx(e.from) + NODE_W, y1 = ny(e.from) + NODE_H / 2, x2 = nx(e.to), y2 = ny(e.to) + NODE_H / 2, mx = (x1 + x2) / 2;
        s += '<path class="gedge" d="M' + x1 + ' ' + y1 + ' C' + mx + ' ' + y1 + ' ' + mx + ' ' + y2 + ' ' + x2 + ' ' + y2 + '"/>' +
             '<text class="glab" x="' + (x2 - 22) + '" y="' + (y2 - 4) + '">' + e.label + '</text>';
      } else {
        var x = nx(e.from) + NODE_W / 2, ya = ny(e.from) + NODE_H, yb = ny(e.to);
        s += '<path class="gedge" d="M' + x + ' ' + ya + ' L' + x + ' ' + yb + '"/><text class="glab" x="' + (x + 5) + '" y="' + ((ya + yb) / 2 + 4) + '">假</text>';
      }
    });
    nodes.forEach(function (n) {
      var c = colors.get(n.key), same = selKey && n.key === selKey, isSel = n.id === gSel;
      var stroke = isSel ? 'var(--acc)' : (same ? c : ''), sw = isSel ? 3 : (same ? 3 : 1.5);
      var label = 'L' + n.line + ' ' + n.cond; if (label.length > 27) label = label.slice(0, 26) + '…';
      s += '<g class="gn" data-id="' + n.id + '"><title>第 ' + n.line + '–' + n.endLine + ' 行 if (' + esc(n.cond) + ')</title>' +
        '<rect class="b" x="' + nx(n.id) + '" y="' + ny(n.id) + '" width="' + NODE_W + '" height="' + NODE_H + '" rx="6"' +
        (stroke ? ' style="stroke:' + stroke + ';stroke-width:' + sw + '"' : '') + '/>' +
        (c ? '<rect x="' + nx(n.id) + '" y="' + ny(n.id) + '" width="6" height="' + NODE_H + '" rx="3" fill="' + c + '"/>' : '') +
        '<text x="' + (nx(n.id) + 12) + '" y="' + (ny(n.id) + 18) + '">' + esc(label) + '</text>' +
        (n.groupSize > 1 ? '<text class="gcnt" x="' + (nx(n.id) + NODE_W - 4) + '" y="' + (ny(n.id) + 18) + '" text-anchor="end">×' + n.groupSize + '</text>' : '') +
        '</g>';
    });
    s += '</svg>';

    $('gbody').innerHTML = '<p class="hint">共 ' + nodes.length + ' 個 if。同色的節點是相同條件,數字是出現次數。點節點查看並比對。</p>' +
      '<div class="gbox">' + s + '</div><div id="gdetail"></div>';
    $('status').textContent = '節點圖:' + nodes.length + ' 個 if';
    $('gbody').querySelector('svg').addEventListener('click', function (ev) {
      var g = ev.target.closest ? ev.target.closest('g.gn') : null;
      if (!g) return;
      var old = $('gbody').querySelector('.gbox'), sl = old.scrollLeft, st = old.scrollTop;
      gSel = +g.getAttribute('data-id'); gDiffId = -1; drawGraph();
      var nb = $('gbody').querySelector('.gbox'); if (nb) { nb.scrollLeft = sl; nb.scrollTop = st; }   // 保持捲動位置
    });
    if (sel) renderDetail(sel);
  }

  function renderDetail(n) {
    var d = $('gdetail');
    var same = ifData.filter(function (x) { return x.key === n.key && x.id !== n.id; });
    var h = '<div class="card"><div class="ch">第 ' + n.line + '–' + n.endLine + ' 行 · if (' + esc(n.cond) + ')</div>';
    if (n.requires.length) h += '<div class="hint">要走到這裡:' + esc(n.requires.join(';')) + '</div>';
    h += '<p><button class="sw" id="gwork">→ 作業區:這段程式碼</button> ' +
      (gRoot !== n.id ? '<button class="sw" id="groot">只看這個 if 及其內部</button>' : '') + '</p>';
    if (same.length) {
      h += '<div>相同條件的其他處(點擊比對 if 底下的程式碼):</div><div>' +
        same.map(function (x) { return '<button class="chip' + (x.id === gDiffId ? ' on' : '') + '" data-c="' + x.id + '">第 ' + x.line + '–' + x.endLine + ' 行</button>'; }).join('') + '</div>';
    } else h += '<div class="hint">這個條件沒有出現在其他地方。</div>';
    h += '<div class="dv" id="gdiff"></div></div>';
    d.innerHTML = h;
    $('gwork').onclick = function () { sendToWork('if 第 ' + n.line + '–' + n.endLine + ' 行', ifLines.slice(n.line - 1, n.endLine).join('\n')); };
    if ($('groot')) $('groot').onclick = function () { gRoot = n.id; gDiffId = -1; drawGraph(); };
    Array.prototype.forEach.call(d.querySelectorAll('[data-c]'), function (b) {
      b.onclick = function () {
        gDiffId = +b.getAttribute('data-c');
        var o = ifData[gDiffId];
        Array.prototype.forEach.call(d.querySelectorAll('[data-c]'), function (x) { x.classList.toggle('on', x === b); });
        $('gdiff').innerHTML = '<p class="hint">左:第 ' + n.line + ' 行這個 if;右:第 ' + o.line + ' 行這個 if。</p>' +
          renderDiff({ from: n.line - 1, to: n.endLine - 1 }, { from: o.line - 1, to: o.endLine - 1 }, gLines);
      };
    });
  }

  /* ---------- 作業區 ---------- */
  var KEY = 'dupfinder.work', saveTimer = null;
  function wcount() { var v = $('work').value; $('wcount').textContent = v ? v.split('\n').length + ' 行' : ''; }
  function saveWork() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { try { localStorage.setItem(KEY, $('work').value); } catch (e) { /* 無法暫存就算了 */ } }, 400);
  }
  function sendToWork(label, body) {
    var w = $('work'), cur = w.value;
    w.value = (cur ? cur.replace(/\s+$/, '') + '\n\n' : '') + '// === ' + label + '\n' + body + '\n';
    w.scrollTop = w.scrollHeight; wcount(); saveWork();
    $('status').textContent = '已送到作業區:' + label;
  }
  try { $('work').value = localStorage.getItem(KEY) || ''; } catch (e) { /* 讀不到就從空白開始 */ }
  $('work').addEventListener('input', function () { wcount(); saveWork(); });
  $('wclear').onclick = function () {
    if ($('work').value && !confirm('清空作業區?這會刪除目前的內容。')) return;
    $('work').value = ''; wcount(); saveWork();
  };
  $('wcopy').onclick = function () {
    var w = $('work'), done = function () { $('status').textContent = '已複製作業區內容'; };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(w.value).then(done, fallback);
    else fallback();
    function fallback() { w.select(); try { if (document.execCommand('copy')) done(); } catch (e) { /* 請手動複製 */ } }
  };
  $('wdl').onclick = function () {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + $('work').value], { type: 'text/plain;charset=utf-8' }));
    a.download = 'work.cs'; document.body.appendChild(a); a.click(); a.remove();
  };
  wcount();

  updateCount();
})();
</script>
</body>
</html>
